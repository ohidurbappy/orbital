name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # The build embeds a 13.7 MB model that build.rs fetches once. The key is
      # the blob's SHA-256, so a cache hit can never serve stale weights.
      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: model
          key: needle2-b43aabfcaf1a6db6

      # Formatting and lints only need to be checked once.
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check
      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test
