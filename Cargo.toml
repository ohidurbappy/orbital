[package]
name = "orbital"
version = "0.1.0"
edition = "2021"
# Set by the highest MSRV among the dependencies (ureq).
rust-version = "1.85"
description = "A growable cross-platform CLI toolbox"
repository = "https://github.com/ohidurbappy/orbital"

[[bin]]
name = "orbital"
path = "src/main.rs"

[dependencies]
crossterm = "0.29.0"
flate2 = "1.1.9"
if-addrs = "0.15.0"
qrcode = { version = "0.14.1", default-features = false }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = { version = "0.34.2", default-features = false, features = ["system"] }
tiny_http = "0.12.0"
ureq = { version = "3.2.1", features = ["json"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
