[package]
name = "orbital"
version = "0.2.0"
edition = "2021"
# Set by the highest MSRV among the dependencies (ureq).
rust-version = "1.85"
description = "A growable cross-platform CLI toolbox"
repository = "https://github.com/ohidurbappy/orbital"

[[bin]]
name = "orbital"
path = "src/main.rs"

[dependencies]
crossterm = "0.29.0"
flate2 = "1.1.9"
if-addrs = "0.15.0"
qrcode = { version = "0.14.1", default-features = false }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = { version = "0.34.2", default-features = false, features = ["system"] }
tiny_http = "0.12.0"
ureq = { version = "3.2.1", features = ["json"] }

# `orbital install` writes HKCU\Environment\Path directly, because every
# higher-level route corrupts it: `setx` truncates at 1024 characters, and
# .NET's SetEnvironmentVariable expands %VAR% on read and demotes the value to
# REG_SZ. Already in the tree via if-addrs, so this adds no build cost.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }

# The build script fetches and checksums the model weights that `orbital do`
# embeds; it reuses the HTTP client already in the tree rather than adding one.
[build-dependencies]
ureq = "3.2.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
